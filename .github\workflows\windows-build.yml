name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "多重解压与MP4提取工具" --collect-all py7zr --collect-all rarfile src/main.py

      - name: Prepare portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\desktop-automation-tool-windows | Out-Null
          Copy-Item "dist\多重解压与MP4提取工具.exe" "release\desktop-automation-tool-windows\"
          Copy-Item "README.md" "release\desktop-automation-tool-windows\"
          Copy-Item "LICENSE" "release\desktop-automation-tool-windows\"
          Compress-Archive -Path "release\desktop-automation-tool-windows\*" -DestinationPath "release\desktop-automation-tool-windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-automation-tool-windows
          path: release/desktop-automation-tool-windows.zip

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/desktop-automation-tool-windows.zip
          generate_release_notes: true
